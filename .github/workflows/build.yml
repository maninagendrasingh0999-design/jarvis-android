name: 100% Guaranteed Jarvis APK Builder

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 4. Extract ZIP & Build Bulletproof Android Project
        run: |
          echo " Extracting uploaded ZIP files..."
          mkdir -p extracted_zip
          for z in *.zip; do
            if [ -f "$z" ]; then
              unzip -o "$z" -d extracted_zip/ || true
            fi
          done

          # Prepare clean Android directory structure
          mkdir -p app/src/main/java/com/myassistant/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          # Locate index.html from ZIP or repo root
          FOUND_HTML=$(find extracted_zip . -maxdepth 4 -name "index.html" | head -n 1)
          if [ -n "$FOUND_HTML" ]; then
            echo "Found index.html at: $FOUND_HTML"
            cp "$FOUND_HTML" app/src/main/assets/index.html
          elif [ -f "index.html" ]; then
            cp index.html app/src/main/assets/index.html
          fi

          # If AI Studio built a React/Vite web app instead of single index.html, bundle or fallback
          if [ ! -f "app/src/main/assets/index.html" ]; then
            echo "Creating fallback index.html..."
            cat << 'EOF_HTML' > app/src/main/assets/index.html
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS</title></head>
          <body style="background:#02060d;color:#00f3ff;font-family:sans-serif;text-align:center;padding-top:40%;">
          <h2>J.A.R.V.I.S. ONLINE</h2><p>Tap Floating Ball or Speak Command</p></body></html>
          EOF_HTML
          fi

          # 1. Root settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JarvisPro"
          include ':app'
          EOF

          # 2. Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          # 4. app/build.gradle (Zero conflict config)
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.myassistant.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.myassistant.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "2.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.9.0'
          }
          EOF

          # 5. AndroidManifest.xml (No package attribute error, full permissions)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="J.A.R.V.I.S."
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".FloatingOrbService"
                      android:enabled="true"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          # 6. FloatingOrbService.kt (Glowing Cyan Arc-Reactor Floating Ball)
          cat << 'EOF' > app/src/main/java/com/myassistant/app/FloatingOrbService.kt
          package com.myassistant.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.IBinder
          import android.provider.Settings
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.TextView
          import androidx.core.app.NotificationCompat

          class FloatingOrbService : Service() {
              private var windowManager: WindowManager? = null
              private var floatingView: View? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  startForegroundServiceNotification()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                      stopSelf()
                      return
                  }
                  showFloatingBall()
              }

              private fun startForegroundServiceNotification() {
                  val channelId = "jarvis_orb_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val chan = NotificationChannel(channelId, "JARVIS Core Service", NotificationManager.IMPORTANCE_LOW)
                      val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      manager.createNotificationChannel(chan)
                  }
                  val notification: Notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("J.A.R.V.I.S. Active")
                      .setContentText("Tap floating orb anytime to speak")
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setOngoing(true)
                      .build()
                  startForeground(101, notification)
              }

              private fun showFloatingBall() {
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager

                  val size = (64 * resources.displayMetrics.density).toInt()
                  val container = FrameLayout(this)

                  val bg = GradientDrawable().apply {
                      shape = GradientDrawable.OVAL
                      setColor(Color.parseColor("#DD03162E"))
                      setStroke(6, Color.parseColor("#00F3FF"))
                  }
                  container.background = bg

                  val label = TextView(this).apply {
                      text = "AI"
                      setTextColor(Color.parseColor("#00F3FF"))
                      textSize = 15f
                      gravity = Gravity.CENTER
                  }
                  container.addView(label, FrameLayout.LayoutParams(size, size))

                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val params = WindowManager.LayoutParams(
                      size, size, layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 20
                      y = 350
                  }

                  var initialX = 0
                  var initialY = 0
                  var initialTouchX = 0f
                  var initialTouchY = 0f

                  container.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              initialX = params.x
                              initialY = params.y
                              initialTouchX = event.rawX
                              initialTouchY = event.rawY
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              params.x = initialX + (event.rawX - initialTouchX).toInt()
                              params.y = initialY + (event.rawY - initialTouchY).toInt()
                              windowManager?.updateViewLayout(container, params)
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              val dx = Math.abs(event.rawX - initialTouchX)
                              val dy = Math.abs(event.rawY - initialTouchY)
                              if (dx < 12 && dy < 12) {
                                  val launchIntent = Intent(this, MainActivity::class.java).apply {
                                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                                      putExtra("TRIGGER_VOICE", true)
                                  }
                                  startActivity(launchIntent)
                              }
                              true
                          }
                          else -> false
                      }
                  }

                  floatingView = container
                  windowManager?.addView(floatingView, params)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  if (floatingView != null) {
                      windowManager?.removeView(floatingView)
                  }
              }
          }
          EOF

          # 7. MainActivity.kt (Local WebView + Native Android Bridge + Zero Google Login)
          cat << 'EOF' > app/src/main/java/com/myassistant/app/MainActivity.kt
          package com.myassistant.app

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.hardware.camera2.CameraManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.speech.tts.TextToSpeech
          import android.webkit.JavascriptInterface
          import android.webkit.PermissionRequest
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import java.util.Locale

          class MainActivity : AppCompatActivity(), TextToSpeech.OnInitListener {

              private lateinit var webView: WebView
              private var tts: TextToSpeech? = null

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  tts = TextToSpeech(this, this)
                  requestNeededPermissions()

                  webView = WebView(this)
                  setContentView(webView)

                  val s = webView.settings
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  s.mediaPlaybackRequiresUserGesture = false
                  s.allowFileAccess = true
                  s.allowContentAccess = true

                  webView.addJavascriptInterface(JarvisBridge(), "JarvisAndroid")
                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onPermissionRequest(request: PermissionRequest) {
                          runOnUiThread { request.grant(request.resources) }
                      }
                  }

                  webView.loadUrl("file:///android_asset/index.html")
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  if (intent?.getBooleanExtra("TRIGGER_VOICE", false) == true) {
                      webView.evaluateJavascript("if(window.triggerJarvisFromFloatingBall) window.triggerJarvisFromFloatingBall();", null)
                  }
              }

              private fun requestNeededPermissions() {
                  val perms = mutableListOf(
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.CAMERA,
                      Manifest.permission.CALL_PHONE
                  )
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  }
                  ActivityCompat.requestPermissions(this, perms.toTypedArray(), 200)
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      tts?.language = Locale("hi", "IN")
                  }
              }

              inner class JarvisBridge {
                  @JavascriptInterface
                  fun speak(text: String) {
                      tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "jarvis_utt")
                  }

                  @JavascriptInterface
                  fun toggleTorch(state: Boolean) {
                      try {
                          val camManager = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                          val camId = camManager.cameraIdList[0]
                          camManager.setTorchMode(camId, state)
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }

                  @JavascriptInterface
                  fun startFloatingOrb() {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this@MainActivity)) {
                          val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                          startActivity(intent)
                      } else {
                          val sIntent = Intent(this@MainActivity, FloatingOrbService::class.java)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              startForegroundService(sIntent)
                          } else {
                              startService(sIntent)
                          }
                      }
                  }

                  @JavascriptInterface
                  fun sendWhatsApp(phone: String, message: String) {
                      try {
                          val uri = Uri.parse("https://api.whatsapp.com/send?phone=$phone&text=" + Uri.encode(message))
                          val i = Intent(Intent.ACTION_VIEW, uri)
                          startActivity(i)
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
              }

              override fun onDestroy() {
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
          EOF

          echo "Compiling APK with Gradle..."
          gradle assembleDebug --no-daemon

      - name: 5. Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Pro-Guaranteed-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
